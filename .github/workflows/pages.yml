# Verifies the site on every push and pull request, and deploys it to GitHub
# Pages when main changes. Actions are pinned to commit SHAs; the tag each one
# came from is in the comment.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # A newer push may cancel a running check, but never a deploy that is half done.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Advisory only: the build-time dependencies run on the maintainer's own spec.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npm run format:check
      - run: npm test
      - run: npm run check:openapi
      - run: npm run build
      - run: npm run check:links
      - run: npx playwright install --with-deps chromium firefox
      # The web server in playwright.config.ts builds again; search needs a full build.
      - run: npx playwright test --project=chromium --project=firefox
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job may write to Pages or request the OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
